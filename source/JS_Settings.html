<script>
/**
* =========================================
* FLOWPILOT CLIENT-SIDE ENGINE (V8 FRONTEND)
* Module: Settings (Configuration, Workflows, ACL & Sheet Mapping)
* Pipeline: Clean Architecture & Status Dot UI Integration
* =========================================
*/

// --- 1. SETTINGS NAVIGATION ---
function openMasterSettings() {
renderWorkflowList();
renderChannelList();
renderPolicyList();
renderCategoryList();
renderQaList();
renderAppTaskList();
switchSettingsTab('Workflows', document.querySelector('.settings-tab-btn'));
if (masterSettingsModalObj) masterSettingsModalObj.show();
}

function switchSettingsTab(tabName, el) {
document.querySelectorAll('.settings-tab-btn').forEach(b => b.classList.remove('active'));
if(el) el.classList.add('active');
document.querySelectorAll('.settings-pane').forEach(p => {
p.classList.remove('active');
p.style.display = 'none';
});
const activePane = document.getElementById('settingsPane-' + tabName);
if(activePane) {
activePane.classList.add('active');
activePane.style.display = 'block';
}
}

// --- 2. WORKFLOWS ENGINE ---
function renderWorkflowDropdowns() {
const wfForge = document.getElementById('workflowFilter');
const wfAgent = document.getElementById('agentWorkflowFilter');
let htmlForge = '<option value="ALL">🌐 All Workflows</option>';
let htmlAgent = '';
targetWorkflows.forEach(wf => {
let safeWf = escapeHTML(wf);
htmlForge += `<option value="${safeWf}">🛡️ ${safeWf}</option>`;
htmlAgent += `<option value="${safeWf}">🛡️ ${safeWf}</option>`;
});
if(wfForge) {
const currentForgeVal = wfForge.value;
wfForge.innerHTML = htmlForge;
if (currentForgeVal && (targetWorkflows.includes(currentForgeVal) || currentForgeVal === 'ALL')) {
wfForge.value = currentForgeVal;
} else {
wfForge.value = targetWorkflows[0] || 'ALL';
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(wfForge.value);
}
}
if(wfAgent) {
const currentAgentVal = wfAgent.value;
wfAgent.innerHTML = htmlAgent;
if (currentAgentVal && targetWorkflows.includes(currentAgentVal)) {
wfAgent.value = currentAgentVal;
} else if (targetWorkflows.length > 0) {
wfAgent.value = targetWorkflows[0];
}
}
}

function renderWorkflowList() {
const container = document.getElementById('workflowListContainer');
if(!container) return;
container.innerHTML = targetWorkflows.map(w => `
<div class="cat-list-item">
<span class="text-secondary fw-bold">${escapeHTML(w)}</span>
<button class="btn btn-icon-sm delete border-0 shadow-none" onclick="deleteWorkflow('${w.replace(/'/g, "\\'")}')">
<i class="material-icons">delete</i>
</button>
</div>
`).join('');
}

function addWorkflow() {
const val = document.getElementById('newWorkflowInput').value.trim();
if(val && !targetWorkflows.includes(val)) {
targetWorkflows.push(val);
workflowPolicies[val] = [...DEFAULT_POLICIES];
workflowTasks[val] = [];

syncToGlobalState();
document.getElementById('newWorkflowInput').value = '';
renderWorkflowList();
renderWorkflowDropdowns();
if(document.getElementById('settingsPolicyWfSelect')) document.getElementById('settingsPolicyWfSelect').innerHTML = '';
if(document.getElementById('settingsTaskWfSelect')) document.getElementById('settingsTaskWfSelect').innerHTML = '';
showToast(`Initializing database for ${val}...`, "info");
google.script.run.withSuccessHandler(res => {
if(res && res.success) showToast(`Database successfully created for ${val}!`, "success");
}).createWorkflowSheet(val);
} else if (val) {
showToast("Workflow already exists.", "error");
}
}

function deleteWorkflow(wf) {
if(confirm("Are you sure you want to delete this workflow? Existing InfoCards won't be deleted, but you won't be able to filter them easily.")) {
targetWorkflows = targetWorkflows.filter(w => w !== wf);
if (targetWorkflows.length === 0) {
targetWorkflows = ['DEMO'];
workflowPolicies['DEMO'] = [...DEFAULT_POLICIES];
workflowTasks['DEMO'] = [];
}
delete workflowPolicies[wf];
delete workflowTasks[wf];

syncToGlobalState();
renderWorkflowList();
renderWorkflowDropdowns();
if(document.getElementById('settingsPolicyWfSelect')) document.getElementById('settingsPolicyWfSelect').innerHTML = '';
if(document.getElementById('settingsTaskWfSelect')) document.getElementById('settingsTaskWfSelect').innerHTML = '';

if (state.activeWorkflow === wf) {
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(targetWorkflows[0]);
if (document.getElementById('workflowFilter')) document.getElementById('workflowFilter').value = state.activeWorkflow;
if (document.getElementById('agentWorkflowFilter')) document.getElementById('agentWorkflowFilter').value = state.activeWorkflow;
}
if (typeof loadPublishedDbForQA === 'function') loadPublishedDbForQA();
if (typeof loadAgentAlignments === 'function') loadAgentAlignments();
if (typeof fetchKbMetrics === 'function') fetchKbMetrics();
}
}

// --- 3. KNOWLEDGE CHANNELS ---
function renderChannelsSidebar() {
const containers = document.querySelectorAll('.dynamic-channels-container');
containers.forEach(container => {
container.innerHTML = '';
if(typeof knowledgeChannels === 'undefined' || !knowledgeChannels) return;
const uniqueChannels = [...new Set(knowledgeChannels)];
uniqueChannels.forEach(ch => {
let iconStr = 'menu_book';
let chColor = '5, 150, 105';
let chHex = '#059669';

if (ch.toLowerCase().includes('team guides') || ch.toLowerCase().includes('guide')) {
iconStr = 'balance';
chColor = '217, 119, 6';
chHex = '#d97706';
} else if (ch.toLowerCase().includes('release notes') || ch.toLowerCase().includes('slide')) {
iconStr = 'school';
chColor = '96, 165, 250';
chHex = '#60a5fa';
} else if (ch.toLowerCase().includes('urgent')) {
iconStr = 'warning';
chColor = '225, 29, 72';
chHex = '#e11d48';
}
const div = document.createElement('div');
div.className = `menu-item dynamic-channel-btn ${typeof activeAgentChannel !== 'undefined' && activeAgentChannel === ch ? 'active' : ''}`;
div.style.setProperty('--ch-color', chHex);
div.style.setProperty('--ch-rgb', chColor);
div.style.flexDirection = 'column';
div.style.alignItems = 'flex-start';
div.onclick = (e) => { if(typeof switchAgentChannel === 'function') switchAgentChannel(ch, e.currentTarget); };
let totalBadge = typeof kbMetricsCache !== 'undefined' && kbMetricsCache[ch] && kbMetricsCache[ch]._total ? `<span class="badge ms-auto" style="background:var(--ch-color); color:#fff; font-size:0.7rem; padding: 4px 8px;">${kbMetricsCache[ch]._total}</span>` : '';
const headerHtml = `<div style="display:flex; align-items:center; width:100%; gap:14px;"><i class="material-icons">${iconStr}</i> <span>${escapeHTML(ch)}</span> ${totalBadge}</div>`;
let metricsHtml = '';
if (typeof kbMetricsCache !== 'undefined' && kbMetricsCache[ch]) {
metricsHtml += `<div style="display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; padding-left:38px; width:100%;">`;
for (let wf in kbMetricsCache[ch]) {
if (wf !== '_total') {
metricsHtml += `<span class="badge badge-wf">${escapeHTML(wf)}: ${kbMetricsCache[ch][wf]}</span>`;
}
}
metricsHtml += `</div>`;
}

div.innerHTML = headerHtml + metricsHtml;
container.appendChild(div);
});
});
const targetSel = document.getElementById('targetChannel');
if(targetSel && typeof knowledgeChannels !== 'undefined' && knowledgeChannels) {
const currentVal = targetSel.value;
targetSel.innerHTML = '';
const uniqueChannels = [...new Set(knowledgeChannels)];
uniqueChannels.forEach(ch => {
let iconE = '🟢';
if (ch.toLowerCase().includes('team guides') || ch.toLowerCase().includes('guide')) iconE = '🟡';
else if (ch.toLowerCase().includes('release notes') || ch.toLowerCase().includes('slide')) iconE = '🔵';
else if (ch.toLowerCase().includes('urgent')) iconE = '🔴';
targetSel.add(new Option(iconE + ' ' + ch, ch));
});
if(uniqueChannels.includes(currentVal)) targetSel.value = currentVal;
}
}

function renderChannelList() {
const container = document.getElementById('channelListContainer');
if(!container) return;
container.innerHTML = knowledgeChannels.map((c) => `<div class="cat-list-item"><span class="text-secondary fw-bold">${escapeHTML(c)}</span><button class="btn btn-icon-sm delete border-0 shadow-none" onclick="deleteChannel('${c.replace(/'/g, "\\'")}')"><i class="material-icons">delete</i></button></div>`).join('');
}

function addChannel() {
const val = document.getElementById('newChannelInput').value.trim();
if(val && !knowledgeChannels.includes(val)) {
knowledgeChannels.push(val);
syncToGlobalState();
document.getElementById('newChannelInput').value = '';
renderChannelList();
renderChannelsSidebar();
}
}

function deleteChannel(chName) {
if(confirm("Are you sure you want to delete this channel? Note: InfoCards associated with this channel will be hidden from the main views.")) {
knowledgeChannels = knowledgeChannels.filter(c => c !== chName);
if (knowledgeChannels.length === 0) knowledgeChannels = ['General KB'];
if (activeAgentChannel === chName) activeAgentChannel = knowledgeChannels[0];
syncToGlobalState();
renderChannelList();
renderChannelsSidebar();
if (typeof switchAgentChannel === 'function') switchAgentChannel(activeAgentChannel);
}
}

// --- 4. POLICIES (DYNAMIC RELATIONAL) ---
function initPolicyChips(existingString) {
currentCardPolicies.clear();
if (existingString) {
existingString.split(',').map(s => s.trim()).forEach(s => {
if(s) currentCardPolicies.add(s);
});
}
renderPolicyChips();
}

function togglePolicyChip(pol) {
if (currentCardPolicies.has(pol)) {
currentCardPolicies.delete(pol);
} else {
currentCardPolicies.add(pol);
}
renderPolicyChips();
}

function renderPolicyChips() {
const container = document.getElementById('val-explanation-chips');
const dropdown = document.getElementById('policyDropdownSelect');
const hiddenInput = document.getElementById('val-explanation');
if (!container || !dropdown || !hiddenInput) return;
dropdown.innerHTML = '<option value="">+ Select Policy...</option>';
predefinedPolicies.sort().forEach(p => {
if(!currentCardPolicies.has(p)) {
dropdown.add(new Option(p, p));
}
});
let html = '';
Array.from(currentCardPolicies).sort().forEach(pol => {
let vLower = pol.toLowerCase().trim();
let bgClass = 'bg-danger border-danger text-white';
let iconClass = 'text-white-50';
if (vLower.startsWith('tentative') || vLower.includes('tentative')) {
bgClass = 'bg-warning border-warning text-dark';
iconClass = 'text-dark';
} else if (vLower.includes('no violation') || vLower.includes('safe') || vLower.includes('ok') || vLower.includes('non violative')) {
bgClass = 'bg-success border-success text-white';
}

html += `<span class="badge ${bgClass} d-inline-flex align-items-center gap-2 border animate-fade-in" style="padding: 6px 12px; font-size: 0.85rem; font-weight:600; border-radius:8px;">
${escapeHTML(pol)}
<i class="material-icons cursor-pointer ${iconClass}" style="font-size:14px;" onclick="togglePolicyChip('${escapeHTML(pol.replace(/'/g, "\\'"))}')">close</i>
</span>`;
});
container.innerHTML = html || '<div class="small text-muted fst-italic py-1">No operational policies selected. InfoCard defaults to generalized review state.</div>';
hiddenInput.value = Array.from(currentCardPolicies).join(', ');
}

function renderPolicyList() {
const container = document.getElementById('policyListContainer');
if(!container) return;

let wfSelect = document.getElementById('settingsPolicyWfSelect');
if (!wfSelect) {
const wrapper = document.createElement('div');
wrapper.className = "mb-3 d-flex align-items-center gap-2 p-2 rounded-3";
wrapper.style.background = "rgba(var(--primary-rgb), 0.05)";
wrapper.style.border = "1px dashed rgba(var(--primary-rgb), 0.3)";
wrapper.innerHTML = `<i class="material-icons text-primary" style="font-size:18px;">route</i><span class="fw-bold text-primary small text-uppercase">Target Workflow:</span><select id="settingsPolicyWfSelect" class="form-select glass-input m-0 flex-grow-1" style="height:36px; padding:4px 12px; font-weight:700;" onchange="renderPolicyList()"></select>`;
container.parentNode.insertBefore(wrapper, container);
wfSelect = document.getElementById('settingsPolicyWfSelect');
}

if (wfSelect.options.length === 0 || wfSelect.options.length !== targetWorkflows.length) {
const currentVal = wfSelect.value || state.activeWorkflow;
wfSelect.innerHTML = targetWorkflows.map(w => `<option value="${escapeHTML(w)}">🛡️ ${escapeHTML(w)}</option>`).join('');
if(targetWorkflows.includes(currentVal)) wfSelect.value = currentVal;
}

const targetWf = wfSelect.value || targetWorkflows[0];
const policies = workflowPolicies[targetWf] || [];

container.innerHTML = policies.map(p => `<div class="cat-list-item"><span class="text-secondary fw-bold">${escapeHTML(p)}</span><button class="btn btn-icon-sm delete border-0 shadow-none" onclick="deletePolicy('${p.replace(/'/g, "\\'")}')"><i class="material-icons">delete</i></button></div>`).join('');
}

function addPolicy() {
const val = document.getElementById('newPolicyInput').value.trim();
const wfSelect = document.getElementById('settingsPolicyWfSelect');
const targetWf = wfSelect ? wfSelect.value : state.activeWorkflow;

if(!workflowPolicies[targetWf]) workflowPolicies[targetWf] = [];

if(val && !workflowPolicies[targetWf].includes(val)) {
workflowPolicies[targetWf].push(val);
if(targetWf === state.activeWorkflow) {
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(targetWf);
if(typeof renderPolicyChips === 'function') renderPolicyChips();
}

syncToGlobalState();
document.getElementById('newPolicyInput').value = '';
renderPolicyList();
}
}

function deletePolicy(pol) {
const wfSelect = document.getElementById('settingsPolicyWfSelect');
const targetWf = wfSelect ? wfSelect.value : state.activeWorkflow;

if(workflowPolicies[targetWf]) {
workflowPolicies[targetWf] = workflowPolicies[targetWf].filter(p => p !== pol);
if(targetWf === state.activeWorkflow) {
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(targetWf);
if(typeof renderPolicyChips === 'function') renderPolicyChips();
}

syncToGlobalState();
renderPolicyList();
}
}

// --- 5. QA NAMES & APP TASKS (DYNAMIC RELATIONAL) ---
function renderQaList() {
const container = document.getElementById('qaListContainer');
if(!container) return;
container.innerHTML = qaNamesList.map(n => `<div class="cat-list-item"><span class="text-secondary">${escapeHTML(n)}</span><button class="btn btn-icon-sm delete border-0 shadow-none" onclick="deleteQaName('${n.replace(/'/g, "\\'")}')"><i class="material-icons">delete</i></button></div>`).join('');
if(typeof updateQaDatalist === 'function') updateQaDatalist();
}

function addQaName() {
const val = document.getElementById('newQaInput').value.trim();
if(val && !qaNamesList.includes(val)) {
qaNamesList.push(val);
syncToGlobalState();
document.getElementById('newQaInput').value='';
renderQaList();
}
}

function deleteQaName(name) {
qaNamesList = qaNamesList.filter(n => n !== name);
syncToGlobalState();
renderQaList();
}

function updateQaDatalist() {
const dl = document.getElementById('qaNamesDatalist');
if(dl) dl.innerHTML = qaNamesList.map(n => `<option value="${escapeHTML(n)}">`).join('');
}

function renderAppTaskList() {
const container = document.getElementById('taskListContainer');
if(!container) return;

let wfSelect = document.getElementById('settingsTaskWfSelect');
if (!wfSelect) {
const wrapper = document.createElement('div');
wrapper.className = "mb-3 d-flex align-items-center gap-2 p-2 rounded-3";
wrapper.style.background = "rgba(var(--primary-rgb), 0.05)";
wrapper.style.border = "1px dashed rgba(var(--primary-rgb), 0.3)";
wrapper.innerHTML = `<i class="material-icons text-primary" style="font-size:18px;">route</i><span class="fw-bold text-primary small text-uppercase">Target Workflow:</span><select id="settingsTaskWfSelect" class="form-select glass-input m-0 flex-grow-1" style="height:36px; padding:4px 12px; font-weight:700;" onchange="renderAppTaskList()"></select>`;
container.parentNode.insertBefore(wrapper, container);
wfSelect = document.getElementById('settingsTaskWfSelect');
}

if (wfSelect.options.length === 0 || wfSelect.options.length !== targetWorkflows.length) {
const currentVal = wfSelect.value || state.activeWorkflow;
wfSelect.innerHTML = targetWorkflows.map(w => `<option value="${escapeHTML(w)}">🛡️ ${escapeHTML(w)}</option>`).join('');
if(targetWorkflows.includes(currentVal)) wfSelect.value = currentVal;
}

const targetWf = wfSelect.value || targetWorkflows[0];
const tasks = workflowTasks[targetWf] || [];

container.innerHTML = tasks.map((task) => `<div class="cat-list-item"><span class="text-secondary fw-bold">${escapeHTML(task)}</span><button class="btn btn-icon-sm delete border-0 shadow-none" onclick="deleteAppTask('${task.replace(/'/g, "\\'")}')"><i class="material-icons">delete</i></button></div>`).join('');
}

function addAppTask() {
const val = document.getElementById('newTaskInput').value.trim();
const wfSelect = document.getElementById('settingsTaskWfSelect');
const targetWf = wfSelect ? wfSelect.value : state.activeWorkflow;

if(!workflowTasks[targetWf]) workflowTasks[targetWf] = [];

if(val && !workflowTasks[targetWf].includes(val)) {
workflowTasks[targetWf].push(val);
if(targetWf === state.activeWorkflow) {
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(targetWf);
if(typeof updateTaskSelectDropdown === 'function') updateTaskSelectDropdown();
if(typeof renderPOCs === 'function') renderPOCs();
}

syncToGlobalState();
document.getElementById('newTaskInput').value='';
renderAppTaskList();
}
}

function deleteAppTask(taskName) {
if(!confirm("Delete this task? It will be removed from the master schedule.")) return;

const wfSelect = document.getElementById('settingsTaskWfSelect');
const targetWf = wfSelect ? wfSelect.value : state.activeWorkflow;

if(workflowTasks[targetWf]) {
workflowTasks[targetWf] = workflowTasks[targetWf].filter(t => t !== taskName);
pocDatabase = pocDatabase.filter(p => p.task !== taskName);
delete taskLinksDatabase[taskName];
if(targetWf === state.activeWorkflow) {
if(typeof updateActiveWorkflowData === 'function') updateActiveWorkflowData(targetWf);
if(typeof updateTaskSelectDropdown === 'function') updateTaskSelectDropdown();
if(typeof renderPOCs === 'function') renderPOCs();
}

syncToGlobalState();
renderAppTaskList();
}
}

// --- 6. CATEGORIES VISIBILITY ---
function renderCategoryList() {
const container = document.getElementById('categoryListContainer');
if(!container) return;
container.innerHTML = qaCategories.filter(c => c.id !== 'root').map((c) => {
let validIds = [c.id];
if (typeof getCategoryAndDescendants === 'function') validIds = getCategoryAndDescendants(c.id);
const filesInCat = qaDatabase.filter(d => validIds.includes(d.category));
const isVisible = filesInCat.length > 0 && filesInCat.some(d => d.isAgentVisible);
// STATUS DOT FIX (Al posto dell'icona visibility)
const dotStyle = isVisible
? 'width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);'
: 'width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--text-muted); background: transparent;';
return `<div class="cat-list-item">
<span class="text-secondary fw-bold">${escapeHTML(c.name)}</span>
<div class="d-flex align-items-center gap-1">
<button class="btn btn-icon-sm border-0 shadow-none d-flex justify-content-center align-items-center" onclick="toggleCategoryVisibility('${c.id}')" title="Toggle Agent Visibility">
<div style="${dotStyle}"></div>
</button>
<button class="btn btn-icon-sm delete border-0 shadow-none" onclick="activeContextFolderId='${c.id}'; if(typeof handleFolderAction === 'function') handleFolderAction('delete')">
<i class="material-icons text-danger">delete</i>
</button>
</div>
</div>`;
}).join('');
}

function toggleCategoryVisibility(catId) {
let validCategoryIds = [catId];
if (typeof getCategoryAndDescendants === 'function') validCategoryIds = getCategoryAndDescendants(catId);
const filesInCat = qaDatabase.filter(d => validCategoryIds.includes(d.category));
if (filesInCat.length === 0) return showToast("Folder is empty. Add items first.", "info");
const currentlyVisible = filesInCat.some(d => d.isAgentVisible);
const newState = !currentlyVisible;
qaDatabase.forEach(d => { if(validCategoryIds.includes(d.category)) d.isAgentVisible = newState; });
syncToGlobalState();
renderCategoryList();
if(typeof searchFiles === 'function') searchFiles();
showToast(`Folder visibility set to: ${newState ? 'Visible' : 'Hidden'}`, "success");
}

function addCategory() {
const val = document.getElementById('newCategoryInput').value.trim();
if(val && !qaCategories.some(c => c.name.toLowerCase() === val.toLowerCase())) {
qaCategories.push({ id: 'cat_' + Date.now(), name: val, parentId: 'root' });
syncToGlobalState();
document.getElementById('newCategoryInput').value='';
renderCategoryList();
if(typeof renderSidebar === 'function') renderSidebar();
} else if (val) {
showToast("Folder already exists.", "error");
}
}

// --- 8. ACL SECURITY SYSTEM ---
function openAclModal() {
loadAclData();
document.getElementById('aclModal').style.display = 'block';
}

function loadAclData() {
google.script.run.withSuccessHandler(res => {
aclDataCache = res || {};
renderAclList();
}).getAclMap();
}

function renderAclList() {
const container = document.getElementById('aclListContainer');
if (!container) return;
if (Object.keys(aclDataCache).length === 0) {
container.innerHTML = '<div class="text-muted small fst-italic">No clearance records found.</div>';
return;
}
container.innerHTML = Object.keys(aclDataCache).map(email => {
const role = aclDataCache[email];
let roleColor = 'var(--text-muted)';
if(role === 'QA') roleColor = 'var(--success)';
if(role === 'TL') roleColor = 'var(--warning)';
if(role === 'OPS') roleColor = 'var(--primary)';
return `<div class="cat-list-item d-flex justify-content-between mb-2">
<span class="text-secondary fw-bold" style="font-size: 0.85rem;">${escapeHTML(email)}</span>
<div class="d-flex align-items-center gap-2">
<span class="badge" style="background:transparent; border:1px solid ${roleColor}; color:${roleColor};">${escapeHTML(role)}</span>
<button class="btn btn-icon-sm delete border-0 shadow-none" style="width: 24px; height: 24px;" onclick="removeAclUser('${escapeHTML(email)}')"><i class="material-icons" style="font-size:14px;">delete</i></button>
</div>
</div>`;
}).join('');
}

function addAclUser() {
const emailInput = document.getElementById('newAclEmail');
const roleInput = document.getElementById('newAclRole');
const email = emailInput.value.trim().toLowerCase();
const role = roleInput.value;
if (!email) {
showToast("Enter a valid email address.", "error");
return;
}
emailInput.disabled = true;
google.script.run.withSuccessHandler(res => {
emailInput.disabled = false;
if (res.success) {
aclDataCache = res.acl;
renderAclList();
emailInput.value = '';
showToast(`${email} granted ${role} clearance.`, "success");
} else {
showToast(res.error, "error");
}
}).withFailureHandler(err => {
emailInput.disabled = false;
showToast("Network Error", "error");
}).setAclUser(email, role);
}

function removeAclUser(email) {
if(!confirm(`Revoke administrative clearance for ${email}?`)) return;
delete aclDataCache[email];
renderAclList();
showToast(`Clearance revoked for ${email}.`, "success");

google.script.run.withSuccessHandler(res => {
if (res && res.success) {
aclDataCache = res.acl;
renderAclList();
}
}).removeAclUser(email);
}
</script>
