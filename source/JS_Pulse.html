50% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 4px rgba(192, 132, 252, 0.4)); }
75% { transform: scale(1.15) rotate(10deg); filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.8)); }
100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 4px rgba(192, 132, 252, 0.4)); }
}
</style>

<script>
/**
* =========================================
* FLOWPILOT CLIENT-SIDE ENGINE (V8 FRONTEND)
* Module: Broadcast System (News Container & Ticker)
* Pipeline: TG Ticker, 3D Floating UI, Dark Dropdowns & Animated Header
* =========================================
*/

// --- 1. BROADCASTS & NOTIFICATION ENGINE ---

let sessionDismissedTickerId = null;
let tickerAnimationCompleted = false;
let tickerTrackerId = null;
window.currentBroadcastTab = window.currentBroadcastTab || 'create';

function formatBroadcastContent(text) {
if (!text) return '';
let links = [];
let preProcessed = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, function(match, label, url) {
links.push({label: label, url: url});
return `%%MDLINK_${links.length - 1}%%`;
});
let html = '';
if (typeof formatCellContent === 'function') {
html = formatCellContent(preProcessed);
} else {
html = escapeHTML(preProcessed);
}
links.forEach((linkObj, i) => {
let aTag = `<a href="${linkObj.url}" target="_blank" rel="noopener noreferrer" style="color: #60a5fa; text-decoration: underline; font-weight: 800; text-shadow: 0 0 8px rgba(96,165,250,0.4);" onclick="event.stopPropagation()">${escapeHTML(linkObj.label)}</a>`;
html = html.replace(`%%MDLINK_${i}%%`, aTag);
});
return html;
}

function formatTickerContent(text) {
if (!text) return '';
let escaped = escapeHTML(text);
return escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, function(match, label, url) {
return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: 800; text-decoration: underline; pointer-events: auto;" onclick="event.stopPropagation()">${label}</a>`;
});
}

function checkUnreadBroadcasts() {
if (!pulseBroadcasts || pulseBroadcasts.length === 0) return;
const now = Date.now();
const liveBroadcasts = pulseBroadcasts.filter(b => new Date(b.scheduled).getTime() <= now);
if (liveBroadcasts.length === 0) return;

const latestId = Math.max(...liveBroadcasts.map(b => parseInt(b.id)));
const lastReadId = parseInt(localStorage.getItem(`pulse_last_read_${APP_TEAM}`) || "0");
const btn = document.getElementById('ai-toggle-btn');
if (latestId > lastReadId && btn) {
btn.classList.add('has-unread');
}
}

function trackTickerPriority() {
const wrapper = document.getElementById('pulse-ticker');
const icon = document.getElementById('pulse-ticker-icon-symbol');
if (!wrapper || !wrapper.classList.contains('active')) {
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
return;
}

const wrapperRect = wrapper.getBoundingClientRect();
const importantItems = document.querySelectorAll('.ticker-news-item[data-priority="IMPORTANT"]');
let isImportantVisible = false;

importantItems.forEach(item => {
const rect = item.getBoundingClientRect();
if (rect.left < wrapperRect.right && rect.right > wrapperRect.left) {
isImportantVisible = true;
}
});

if (isImportantVisible) {
if (!wrapper.classList.contains('important-ticker')) {
wrapper.classList.add('important-ticker');
if (icon) icon.innerText = 'warning';
}
} else {
if (wrapper.classList.contains('important-ticker')) {
wrapper.classList.remove('important-ticker');
if (icon) icon.innerText = 'campaign';
}
}

tickerTrackerId = requestAnimationFrame(trackTickerPriority);
}

function updateNewsTicker() {
const ticker = document.getElementById('pulse-ticker');
const tickerText = document.getElementById('pulse-ticker-text');
const chatWindow = document.getElementById('ai-chat-window');

if (!ticker || !tickerText) return;

const now = Date.now();
const liveBroadcasts = pulseBroadcasts.filter(b => new Date(b.scheduled).getTime() <= now);

if (liveBroadcasts.length === 0) {
ticker.classList.remove('active');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
return;
}

const maxLiveId = Math.max(...liveBroadcasts.map(b => parseInt(b.id)));
if (sessionDismissedTickerId !== null && maxLiveId <= sessionDismissedTickerId) {
ticker.classList.remove('active');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
return;
}
let totalChars = 0;
const parts = liveBroadcasts.map(b => {
totalChars += (b.author || '').length + (b.payload || '').length;
return `<span class="ticker-news-item" data-priority="${b.priority}"><span style="opacity:0.7; margin-right:8px;">${escapeHTML(b.author)}:</span> ${formatTickerContent(b.payload)}</span>`;
});
const currentContent = parts.join('<span style="margin: 0 40px; color: var(--primary); opacity: 0.6; font-weight: 800;">&bull;</span>');
if (tickerText.innerHTML !== currentContent) {
tickerText.innerHTML = currentContent;
tickerAnimationCompleted = false;
ticker.classList.remove('show-close');
let contentEl = document.querySelector('.pulse-ticker-content');
if (contentEl) {
const newContentEl = contentEl.cloneNode(true);
contentEl.parentNode.replaceChild(newContentEl, contentEl);
contentEl = newContentEl;
const duration = Math.max(15, Math.ceil(totalChars / 12));
contentEl.style.animationDuration = duration + 's';
contentEl.addEventListener('animationiteration', () => {
tickerAnimationCompleted = true;
ticker.classList.add('show-close');
});
}
} else {
if (tickerAnimationCompleted) {
ticker.classList.add('show-close');
}
}

if (chatWindow && chatWindow.classList.contains('ai-hidden')) {
ticker.classList.add('active');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
tickerTrackerId = requestAnimationFrame(trackTickerPriority);
} else {
ticker.classList.remove('active');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
}
}

function closeNewsTicker(event) {
event.stopPropagation();
const ticker = document.getElementById('pulse-ticker');
if (ticker) {
ticker.classList.remove('active');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
const now = Date.now();
const liveBroadcasts = pulseBroadcasts.filter(b => new Date(b.scheduled).getTime() <= now);
if (liveBroadcasts.length > 0) {
const maxLiveId = Math.max(...liveBroadcasts.map(b => parseInt(b.id)));
sessionDismissedTickerId = maxLiveId;
}
}
}

function switchBroadcastTab(tabId) {
window.currentBroadcastTab = tabId;
const btnCreate = document.getElementById('tab-btn-create');
const btnList = document.getElementById('tab-btn-list');
const paneCreate = document.getElementById('bc-pane-create');
const paneList = document.getElementById('bc-pane-list');

if (!btnCreate || !btnList || !paneCreate || !paneList) return;

if (tabId === 'create') {
btnCreate.style.background = 'var(--surface-glass)';
btnCreate.style.color = 'var(--primary)';
btnCreate.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
btnList.style.background = 'transparent';
btnList.style.color = 'var(--text-muted)';
btnList.style.boxShadow = 'none';

paneCreate.style.display = 'flex';
paneList.style.display = 'none';
} else {
btnList.style.background = 'var(--surface-glass)';
btnList.style.color = 'var(--primary)';
btnList.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
btnCreate.style.background = 'transparent';
btnCreate.style.color = 'var(--text-muted)';
btnCreate.style.boxShadow = 'none';

paneList.style.display = 'flex';
paneCreate.style.display = 'none';
}
}

`;
}
if (!isAgent) {

const savedMessage = existingInput ? existingInput.value : '';

</div>

}

function sendBroadcast() {
const msg = document.getElementById('bc-message').value.trim();
const target = document.getElementById('bc-target').value;
const scheduled = document.getElementById('bc-scheduled').value;
const priority = document.getElementById('bc-priority').value;
if(!msg) return showToast("Message cannot be empty.", "error");
const btn = document.getElementById('btnSendBc');
btn.disabled = true;
btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width: 1rem; height: 1rem; margin-right: 8px;"></span> PUBLISHING...';
const payload = { message: msg, target: target, scheduled: scheduled, priority: priority };
google.script.run.withSuccessHandler(res => {
btn.disabled = false;
btn.innerHTML = '<i class="material-icons" style="font-size:20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">rocket_launch</i> PUBLISH';
if(res.success) {
showToast("Broadcast published successfully!", "success");
window.currentBroadcastTab = 'list';
document.getElementById('bc-message').value = '';
loadPulseBroadcasts();
} else {
showToast(res.error, "error");
}
}).publishBroadcast(JSON.stringify(payload));
}

function removeBroadcast(id) {
if(!confirm("Delete this broadcast? It will be removed from all Agent feeds immediately.")) return;
google.script.run.withSuccessHandler(res => {
if(res.success) {
showToast("Broadcast removed.", "success");
loadPulseBroadcasts();
} else {
showToast(res.error, "error");
}
}).deleteBroadcast(id);
}

// --- 2. UI INTERACTIONS ---

function toggleAI() {
const win = document.getElementById('ai-chat-window');
const btn = document.getElementById('ai-toggle-btn');
const ticker = document.getElementById('pulse-ticker');

win.classList.toggle('ai-hidden');
if (!win.classList.contains('ai-hidden')) {
btn.style.transform = 'scale(0.9)';
btn.style.animationPlayState = 'paused';
if (ticker) {
ticker.classList.remove('active');
ticker.classList.add('show-close');
if (tickerTrackerId) cancelAnimationFrame(tickerTrackerId);
}
btn.classList.remove('has-unread');
const now = Date.now();
const liveBroadcasts = pulseBroadcasts.filter(b => new Date(b.scheduled).getTime() <= now);
if (liveBroadcasts.length > 0) {
const latestId = Math.max(...liveBroadcasts.map(b => parseInt(b.id)));
localStorage.setItem(`pulse_last_read_${APP_TEAM}`, latestId.toString());
}
} else {
btn.style.transform = 'scale(1)';
btn.style.animationPlayState = 'running';
updateNewsTicker();
}
}
